<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KleisUp · logo en movimiento</title>
<style>
:root{--ink:#0b0b0d;--cream:#efebe3;--blue:#3a4bd1;--glow:#6f7dff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0b0d;color:var(--cream);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.top{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;padding:12px 16px 8px}
.top h1{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.55;align-self:center;white-space:nowrap}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap;min-width:0}
.tab{flex:1 1 150px;text-align:left;font:inherit;color:var(--cream);background:#ffffff0d;border:1px solid #ffffff14;border-radius:12px;padding:8px 12px;cursor:pointer;display:grid;gap:2px;min-width:0}
.tab b{font-weight:650;font-size:14px;display:flex;gap:8px;align-items:baseline}
.tab b i{font-style:normal;font-size:11px;opacity:.5;font-weight:500;border:1px solid #ffffff30;border-radius:5px;padding:0 5px}
.tab span{font-size:11.5px;opacity:.6;line-height:1.3}
.tab[aria-selected=true]{background:var(--cream);color:#111;border-color:var(--cream)}
.tab[aria-selected=true] span{opacity:.7}
.tab:focus-visible,.bar button:focus-visible,.bar input:focus-visible{outline:2px solid #8fb4ff;outline-offset:2px}
.wrap{min-height:0;display:grid;place-items:center;padding:0 16px}
.frame{position:relative;overflow:hidden;border-radius:10px;background:#0b0b0d;box-shadow:0 0 0 1px #ffffff14,0 20px 60px #0008}
.frame svg,.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame canvas{object-fit:cover;pointer-events:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#141416;border-top:1px solid #ffffff14}
.bar button{font:inherit;background:#ffffff12;color:var(--cream);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.bar button[aria-pressed=true],.bar button.main{background:var(--cream);color:#111}
.bar input[type=range]{flex:1;min-width:160px;accent-color:var(--cream)}
.bar output{font-variant-numeric:tabular-nums;opacity:.7;min-width:11ch;text-align:right}
.sep{width:1px;height:22px;background:#ffffff1f}
.lbl{opacity:.55;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
body.bare{grid-template-rows:1fr}body.bare .top,body.bare .bar{display:none}body.bare .wrap{padding:0}body.bare .frame{border-radius:0;box-shadow:none}
@media (prefers-reduced-motion:reduce){.frame svg,.frame canvas{transition:opacity .3s}}
</style></head><body>

 out[1]=KY+(vx*s+vy*c)*e+P.a2[i]*Math.cos(P.f2[i]*t+P.p2[i])*w;
}
V5.render=(mode,t)=>{
 const c=C(),intro=mode==="intro";
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,1920,1080);ctx.setTransform(SC,0,0,SC,OX,OY);
 // ---- keyhole + letters
 let ks,jit,lo,pa,gl,ring=0,ringR=0,flash=0,flashR=0;
 if(intro){const pop=seg(t,0,.45);
  const back=outBack(seg(t,2.6,3.4),1.4);
  ks=t<2.6?1.5*outBack(pop,1.8):lerp(1.5,1,back);jit=.9*seg(t,.4,1.0)*(1-seg(t,2.2,2.6));
  lo=seg(t,3.4,4.0);pa=1-seg(t,3.35,3.95);gl=smooth(pop)*(1-seg(t,2.8,3.6));
  const rp=seg(t,.9,1.7);ring=(1-rp)*(rp>0?1:0);ringR=lerp(8,140,outExpo(rp))}
 else{let pu=0;[1.0,1.5,1.9,2.2,2.4].forEach(a=>pu+=.2*bell(seg(t,a,a+.28)));const cl_=seg(t,2.55,3.1);
  ks=(1+pu)*(1-inOutCubic(cl_));jit=0;lo=1-seg(t,0,.5);pa=seg(t,0,.35);gl=seg(t,.6,1.2)*(1-seg(cl_,.5,1));
  const fp=seg(cl_,.55,1);flash=Math.sin(Math.PI*fp);flashR=20+110*fp}
 V5.key.style.display=ks>.004?"":"none";
 if(ks>.004){V5.key.setAttribute("fill",c.fg);V5.key.setAttribute("transform",key_tf(KX+jit*Math.sin(t*83),KY+jit*Math.cos(t*71),ks))}
 V5.g.style.display=lo>.003?"":"none";
 if(lo>.003){V5.set.forEach(it=>putLetter(it,()=>({o:1}),t,c.fg,null));if(lo>=1)V5.g.removeAttribute("opacity");else V5.g.setAttribute("opacity",fs(lo))}
 // ---- canvas
 ctx.globalCompositeOperation=BG==="ink"?"lighter":"source-over";
 const hi=BG==="ink"?"#8f9bff":BG==="cream"?BLUE:"#ffffff";
 if(gl>.003){const R=KR*Math.max(ks,.3)*2.2+14,g=ctx.createRadialGradient(KX,KY,0,KX,KY,R+40);g.addColorStop(0,BG==="blue"?"rgba(255,255,255,.55)":"rgba(111,125,255,.55)");g.addColorStop(1,"rgba(111,125,255,0)");
  ctx.globalAlpha=gl*(BG==="cream"?.7:1);ctx.fillStyle=g;ctx.beginPath();ctx.arc(KX,KY,R+40,0,6.2832);ctx.fill()}
 ctx.globalAlpha=1;
 if(ring>.003){ctx.strokeStyle=hi;ctx.lineWidth=.7;ctx.globalAlpha=ring*.8;ctx.beginPath();ctx.arc(KX,KY,ringR,0,6.2832);ctx.stroke()}
 if(pa>.003){
  ctx.globalAlpha=pa;const tmp=[0,0],tmp2=[0,0],cols=[c.fg,hi];
  ctx.lineCap="round";
  for(let b=0;b<6;b++){const list=P.buckets[b];if(!list.length)continue;
   ctx.strokeStyle=cols[b>=3?1:0];ctx.lineWidth=SZ[b%3];ctx.beginPath();
   for(let q=0;q<list.length;q++){const i=list[q];
    if(intro){const u=(t-P.t0[i])/P.du[i];if(u<=0)continue;pos(i,t,true,tmp);
     if(u<1.03){pos(i,t-.03,true,tmp2);ctx.moveTo(tmp2[0],tmp2[1]);ctx.lineTo(tmp[0]+.01,tmp[1])}else{ctx.moveTo(tmp[0],tmp[1]);ctx.lineTo(tmp[0]+.01,tmp[1])}}
    else{const u=(t-P.o0[i])/P.od[i];if(u>=.985)continue;pos(i,t,false,tmp);
     if(u>0){pos(i,t-.03,false,tmp2);ctx.moveTo(tmp2[0],tmp2[1])}else ctx.moveTo(tmp[0],tmp[1]);ctx.lineTo(tmp[0]+.01,tmp[1])}}
   ctx.stroke()}
 }
 if(flash>.003){const g=ctx.createRadialGradient(KX,KY,0,KX,KY,flashR);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.3,"rgba(185,193,255,.7)");g.addColorStop(1,"rgba(111,125,255,0)");
  ctx.globalAlpha=flash;ctx.fillStyle=g;ctx.beginPath();ctx.arc(KX,KY,flashR,0,6.2832);ctx.fill()}
 ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
};
V5.canvas=true;
})();
VS.push(V1,V2,V3,V4,V5);

// =====================================================================================
// player
// =====================================================================================
const HOLD=1.2,TAIL=.4,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=0,mode="loop",T=0,playing=true,last=null,speed=1;
const cv=$("cv"),world=$("world");
function ensure(v){const V=VS[v];if(!V.built){V.root=el("g",null,world);V.root.style.display="none";V.built=true;
  V.root.style.display="";V.build(V.root)}
 VS.forEach((W,j)=>{if(W.root)W.root.style.display=j===v?"":"none"});cv.style.display=VS[v].canvas?"":"none";if(!VS[v].canvas){cv.getContext("2d").clearRect(0,0,1920,1080)}}
const total=()=>{const V=VS[cur];return reduced?.7:mode==="intro"?V.I:mode==="outro"?V.O:V.I+HOLD+V.O+TAIL};
function renderAt(t,v,m){
 const V=VS[v];ensure(v);cur=v;
 $("bg").setAttribute("fill",C().bg);
 if(reduced){V.render("intro",V.I);const o=m==="outro"?1-seg(t,0,.7):seg(t,0,.7);$("stage").style.opacity=o;cv.style.opacity=o;return}
 $("stage").style.opacity="";cv.style.opacity="";
 if(m==="intro")V.render("intro",cl(t,0,V.I));
 else if(m==="outro")V.render("outro",cl(t,0,V.O));
 else if(t<V.I+HOLD)V.render("intro",cl(t,0,V.I));
 else V.render("outro",cl(t-V.I-HOLD,0,V.O));
}
function draw(t){T=t;renderAt(t,cur,mode);$("scrub").value=t/total();$("tt").textContent=t.toFixed(2)+" / "+total().toFixed(2)+"s"}
window.seekFrame=(t,v,m)=>{if(v!==undefined)cur=cl((v|0)-1,0,4);if(m)mode=m;playing=false;syncUI();draw(t)};
function tick(now){if(playing){if(last!==null){T+=(now-last)/1000*speed;
 if(T>=total()){if(mode==="loop")T=0;else{T=total();playing=false}}}draw(T)}last=now;requestAnimationFrame(tick)}
function syncUI(){$("bLoop").setAttribute("aria-pressed",mode==="loop");
 document.querySelectorAll(".tab").forEach((b,j)=>{b.setAttribute("aria-selected",j===cur);b.tabIndex=j===cur?0:-1});
 document.querySelectorAll("[data-bg]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.bg===BG));
 $("bSlow").setAttribute("aria-pressed",speed!==1)}
function play(m){mode=m;T=0;playing=true;syncUI()}
function pick(v){cur=v;T=0;playing=true;last=null;syncUI()}
VS.forEach((V,j)=>{const b=document.createElement("button");Object.entries({class:"tab",type:"button",role:"tab","aria-selected":j===0,"aria-label":`${j+1}. ${V.name}: ${V.desc}`,id:"tab"+j}).forEach(([k,v])=>b.setAttribute(k,v));$("tabs").appendChild(b);
 b.innerHTML=`<b><i>${j+1}</i>${V.name}</b><span>${V.desc}</span>`;b.onclick=()=>pick(j);
 b.onkeydown=e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const n=(j+(e.key==="ArrowRight"?1:4))%5;pick(n);$("tab"+n).focus()}}});
$("bIn").onclick=()=>play("intro");$("bOut").onclick=()=>play("outro");$("bLoop").onclick=()=>play("loop");
$("scrub").oninput=e=>{playing=false;draw(+e.target.value*total())};
document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{BG=b.dataset.bg;syncUI();draw(T)});
$("bSlow").onclick=()=>{speed=speed===1?.4:1;syncUI()};
addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.code==="Space"){e.preventDefault();if(!e.repeat){playing=!playing;last=null}}
 else if(/^[1-5]$/.test(e.key)&&!(e.target.type==="range"))pick(+e.key-1)});
addEventListener("keyup",e=>{if(e.code==="Space")e.preventDefault()});
// size the 16:9 frame inside its cell
function fit(){const w=$("wrap"),r=w.getBoundingClientRect(),cs=getComputedStyle(w),pw=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ph=r.height;
 let W=Math.min(pw,ph*16/9);$("frame").style.width=W+"px";$("frame").style.height=W*9/16+"px"}
new ResizeObserver(fit).observe($("wrap"));addEventListener("resize",fit);
const q=new URLSearchParams(location.search);
if(q.has("bare"))document.body.classList.add("bare");
if(q.has("bg")&&COLS[q.get("bg")])BG=q.get("bg");
if(q.has("v"))cur=cl((+q.get("v")|0)-1,0,4);
syncUI();fit();
if(q.has("t")){mode=q.get("m")||"loop";playing=false;syncUI();draw(+q.get("t"))}
else{if(q.get("m"))mode=q.get("m");if(reduced){mode="intro"}draw(0)}
if(!q.has("t"))requestAnimationFrame(tick);
</script></body></html>
