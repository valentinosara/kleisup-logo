<title>KleisUp · animación del logo</title>
<style>
:root{--ink:#0b0b0d;--cream:#efebe3;--blue:#3a4bd1;--glow:#6f7dff}

html,body{height:100%}

.bar input[type=range]{flex:1;min-width:160px;accent-color:var(--cream)}
.bar output{font-variant-numeric:tabular-nums;opacity:.7;min-width:5ch}
.sep{width:1px;height:22px;background:#ffffff1f}
.lbl{opacity:.55;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
</style></head><body>

const NS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
// ---- layout: lockup units -> stage
const SC=1180/L.w, OX=(1920-L.w*SC)/2, OY=(1080-L.h*SC)/2+8;
$("world").setAttribute("transform",`translate(${OX} ${OY}) scale(${SC})`);
const STAGE_C={x:(960-OX)/SC,y:(540-OY)/SC};   // stage centre in lockup units
const KEY_CY0=L.key.cy, KEY_X=L.key.x;          // final keyhole head centre
const els=L.letters.map(l=>{const g=document.createElementNS(NS,"g"),p=document.createElementNS(NS,"path");
 p.setAttribute("d",l.d);p.setAttribute("transform",`translate(${l.x} ${L.yb})`);g.appendChild(p);$("letters").appendChild(g);
 const m=p.cloneNode();$("maskLetters").appendChild(m);return {g,p,m,...l}});
$("key").setAttribute("d",L.key.d);
// ---- easing
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const outExpo=p=>p>=1?1:1-Math.pow(2,-10*p), inExpo=p=>p<=0?0:Math.pow(2,10*p-10);
const inOutCubic=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, outCubic=p=>1-Math.pow(1-p,3), inCubic=p=>p*p*p;
const outBack=(p,s=1.9)=>1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2);
const inOutQuint=p=>p<.5?16*p**5:1-Math.pow(-2*p+2,5)/2;
// ---- colours
const COL={ink:["#0b0b0d","#efebe3","#3a4bd1"],cream:["#efebe3","#0b0b0d","#3a4bd1"],blue:["#3a4bd1","#ffffff","#0b0b0d"]};
let BG="ink";
function mix(a,b,p){const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=h(a),B=h(b);return"#"+A.map((v,i)=>Math.round(lerp(v,B[i],p)).toString(16).padStart(2,"0")).join("")}
// ---- keyhole pose (head centre x,y in lockup units and scale relative to final)
function setKey(x,y,s,fill){const k=L.key.k*s;
 $("key").setAttribute("transform",`translate(${x} ${y}) scale(${k})`);$("key").setAttribute("fill",fill)}
const BIG=2.6;  // keyhole scale when it first appears alone
// order letters by distance to the keyhole: nearest leave/arrive first
const order=els.map((e,i)=>[Math.abs(e.cx-KEY_X),i]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
const rank=[];order.forEach((i,r)=>rank[i]=r);

// ================= INTRO (0 .. 3.4s) =================
const INTRO=3.4, OUTRO=3.0, HOLD=1.4;
function intro(t){
 const [bg,fg,ac]=COL[BG];
 // 1. keyhole pops in alone, centred, with light behind it
 const pop=seg(t,0.05,0.75), travel=inOutQuint(seg(t,0.85,1.75));
 const s0=pop<=0?0:BIG*outBack(pop,1.6);
 const kx=lerp(STAGE_C.x,KEY_X,travel), ky=lerp(STAGE_C.y,KEY_CY0,travel), ks=lerp(s0,1,travel);
 setKey(kx,ky,pop>=1?ks:s0*(1-travel)+travel,fg);
 // glow: blooms with the pop, follows the key, fades once the word is set
 const gl=outCubic(seg(t,0.1,0.9))*(1-inOutCubic(seg(t,2.2,3.2)));
 const gr=lerp(40,260,outExpo(seg(t,0.1,1.2)))*lerp(1,.55,travel);
 const glow=$("glow");glow.setAttribute("cx",kx);glow.setAttribute("cy",ky);glow.setAttribute("rx",gr*1.25);glow.setAttribute("ry",gr);glow.setAttribute("opacity",(gl*(BG==="blue"?.6:1)).toFixed(3));
 // 2. letters slide out from behind the keyhole, nearest first
 els.forEach((e,i)=>{const st=1.05+rank[i]*0.09, p=seg(t,st,st+0.95), q=outExpo(p);
  const sx=kx-e.cx, sy=ky-e.cy;  // offset from final spot to the keyhole centre
  const sc=lerp(.18,1,outCubic(p)), dx=sx*(1-q), dy=sy*(1-q);
  const v=p>0&&p<1?Math.pow(2,-10*p)*10*Math.abs(sx)/30:0;   // ~velocity for motion blur
  e.g.setAttribute("transform",`translate(${(e.cx+dx).toFixed(2)} ${(e.cy+dy).toFixed(2)}) scale(${sc.toFixed(4)}) translate(${-e.cx} ${-e.cy})`);
  e.g.style.opacity=p<=0?0:cl(p*6).toFixed(3); e.g.style.filter=v>0.05?`blur(${Math.min(6,v).toFixed(2)}px)`:"none"; e.g.setAttribute("fill",fg)});
 // 3. light sweep across the finished word
 const sh=seg(t,2.35,3.25);$("shine").setAttribute("x",lerp(-260,L.w+300,inOutCubic(sh)).toFixed(1));
 $("shine").style.opacity=sh>0&&sh<1?(BG==="ink"?.55:.35):0;
 $("wash").setAttribute("opacity",0);$("bg").setAttribute("fill",bg);
}
// ================= OUTRO (0 .. 3.0s) =================
function outro(t){
 const [bg,fg,ac]=COL[BG];
 // 1. letters get pulled back into the keyhole, farthest last, accelerating
 const kick=seg(t,0,0.25);   // keyhole breathes in before swallowing
 let ks=1+0.12*Math.sin(Math.PI*kick);
 els.forEach((e,i)=>{const st=0.15+(els.length-1-rank[i])*0.06, p=seg(t,st,st+0.7), q=inExpo(p);
  const sx=KEY_X-e.cx, sy=KEY_CY0+8-e.cy;
  const sc=lerp(1,.12,inCubic(p)), v=p>0&&p<1?q*8:0;
  e.g.setAttribute("transform",`translate(${(e.cx+sx*q).toFixed(2)} ${(e.cy+sy*q).toFixed(2)}) scale(${sc.toFixed(4)}) translate(${-e.cx} ${-e.cy})`);
  e.g.style.opacity=(1-seg(p,.82,1)).toFixed(3); e.g.style.filter=v>0.05?`blur(${Math.min(7,v).toFixed(2)}px)`:"none"; e.g.setAttribute("fill",fg)});
 // 2. keyhole recentres, then the camera dives through it (it fills the screen with the accent)
 const cen=inOutCubic(seg(t,1.0,1.55)), dive=inExpo(seg(t,1.5,2.35));
 const kx=lerp(KEY_X,STAGE_C.x,cen), ky=lerp(KEY_CY0,STAGE_C.y,cen);
 ks=ks*lerp(1,1.35,cen)*(1+dive*120);
 // dive towards the stem so the keyhole's widest area covers the frame
 setKey(kx,ky-dive*L.key.R*L.key.k*ks*0.35,ks,mix(fg,ac,outCubic(seg(t,1.45,2.1))));
 const gl=outCubic(seg(t,0.2,1.0))*(1-seg(t,1.6,2.1));
 const glow=$("glow");glow.setAttribute("cx",kx);glow.setAttribute("cy",ky);glow.setAttribute("rx",220);glow.setAttribute("ry",180);glow.setAttribute("opacity",(gl*.8).toFixed(3));
 $("shine").style.opacity=0;
 // 3. accent frame fades back to the background
 $("wash").setAttribute("fill",bg);$("wash").setAttribute("opacity",inOutCubic(seg(t,2.45,3.0)).toFixed(3));
 $("bg").setAttribute("fill",bg);
}
// ================= timeline / player =================
const MODES={intro:INTRO+0.6, outro:OUTRO, loop:INTRO+HOLD+OUTRO+0.5};
let mode="loop", T=0, playing=true, last=null, speed=1;
function draw(t){T=t; if(mode==="intro")intro(t); else if(mode==="outro")outro(t);
 else{ if(t<INTRO+HOLD)intro(t); else if(t<INTRO+HOLD+OUTRO)outro(t-INTRO-HOLD); else outro(OUTRO)}
 $("scrub").value=t/MODES[mode];$("tt").textContent=t.toFixed(2)+"s"}
window.seek=(t,m)=>{if(m)mode=m;playing=false;draw(t)};   // deterministic hook for video export
function tick(now){if(playing){if(last!==null){T+=(now-last)/1000*speed;
 if(T>=MODES[mode]){if(mode==="loop")T=0;else{T=MODES[mode];playing=false}}}draw(T)}last=now;requestAnimationFrame(tick)}
function play(m){mode=m;T=0;playing=true;$("bLoop").setAttribute("aria-pressed",m==="loop")}
$("bIn").onclick=()=>play("intro");$("bOut").onclick=()=>play("outro");$("bLoop").onclick=()=>play("loop");
$("scrub").oninput=e=>{playing=false;draw(+e.target.value*MODES[mode])};
document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{BG=b.dataset.bg;document.querySelectorAll("[data-bg]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw(T)});
$("bSlow").onclick=e=>{speed=speed===1?.4:1;e.target.setAttribute("aria-pressed",speed!==1)};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="BUTTON"){e.preventDefault();playing=!playing}});
const q=new URLSearchParams(location.search);
if(q.has("t")){mode=q.get("m")||"loop";playing=false;draw(+q.get("t"))}
else if(matchMedia("(prefers-reduced-motion: reduce)").matches){mode="intro";playing=false;draw(INTRO)}
requestAnimationFrame(tick);
</script></body></html>
