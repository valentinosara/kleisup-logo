<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KleisUp logo: Llave compacta</title>
<style>
:root{--bg:#0b0b0c;--fg:#ffffff;--paper:#f4f2ee;--ink:#0b0b0c;--accent:#3a4bd1;--muted:#777}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#141414;color:#e9e6df}
main{display:grid;gap:16px;padding:16px;grid-template-columns:repeat(6,1fr)}
section{border-radius:20px;overflow:hidden;position:relative;display:grid;place-items:center;min-height:260px}
.hero{grid-column:1/-1;min-height:520px;background:var(--bg)}
.hero svg.lk{width:min(760px,80%);height:auto}
.light{grid-column:span 3;background:var(--paper)}
.accent{grid-column:span 3;background:var(--accent)}
.light svg.lk,.accent svg.lk{width:70%;height:auto}
.icons{grid-column:span 4;background:#1d1d1d;display:flex;gap:28px;align-items:end;justify-content:center;padding:40px}
.app{border-radius:22.5%;display:grid;place-items:center;background:var(--bg);box-shadow:0 0 0 1px #ffffff14}
.app.alt{background:var(--accent)}.app.pap{background:var(--paper)}
.app svg{height:56%;width:auto}
.small{grid-column:span 2;background:var(--paper);display:flex;flex-direction:column;gap:18px;align-items:flex-start;justify-content:center;padding:32px}
.small svg.lk{width:auto}
.tag{position:absolute;left:18px;top:14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;color:var(--fg)}
.light .tag,.small .tag{color:var(--ink)}
header.meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:24px;align-items:baseline;padding:6px 4px 0;flex-wrap:wrap}
header.meta h1{font-size:18px;font-weight:600}header.meta p{opacity:.7;max-width:720px}
.ctl{grid-column:1/-1;display:flex;gap:28px;flex-wrap:wrap;align-items:center;background:#1d1d1d;border-radius:16px;padding:14px 18px}
.ctl label{display:flex;gap:10px;align-items:center}
.ctl input[type=range]{accent-color:#e9e6df;width:150px}
button{font:inherit;background:#e9e6df;color:#141414;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #8fb4ff;outline-offset:3px}
@media (max-width:900px){main{grid-template-columns:1fr}section,.light,.accent,.icons,.small{grid-column:1/-1}.icons{flex-wrap:wrap}}
</style></head><body><main>
<header class="meta"><h1>Llave compacta</h1><p>Rubik Black (esquinas redondeadas de fábrica) en minúsculas con tracking negativo. El cerrojo sube hasta la altura de la k y la l, como una letra más.</p></header>

</main><script>
const base=[...document.querySelectorAll('svg.lk .t')].map(p=>+(p.getAttribute('stroke-width')||0));
const r=document.getElementById('r'),ks=document.getElementById('ks');

r.oninput=ks.oninput=apply;
document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText('KleisUp logo "Llave compacta": redondeo x'+r.value+', cerrojo x'+ks.value).then(()=>{document.getElementById('ok').textContent='Copiado'})};
